<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내 배터리 보기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg-a: #0b0e14;
    --bg-b: #171226;
    --bg-c: #0d1b1f;
    --text: #eef0f4;
    --muted: rgba(238, 240, 244, 0.6);
    --muted-2: rgba(238, 240, 244, 0.4);
    --accent: #6ea8ff;
    --accent-2: #8f6bff;
    --green: #3ddc84;
    --yellow: #ffc247;
    --red: #ff5d5d;

    --glass-fill: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    --glass-fill-strong: linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    --glass-border: rgba(255,255,255,0.22);
    --glass-highlight: rgba(255,255,255,0.35);
    --glass-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-a: #eef2ff;
      --bg-b: #fdeef7;
      --bg-c: #e9fbf3;
      --text: #1b1e27;
      --muted: rgba(27, 30, 39, 0.62);
      --muted-2: rgba(27, 30, 39, 0.42);
      --glass-fill: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
      --glass-fill-strong: linear-gradient(160deg, rgba(255,255,255,0.7), rgba(255,255,255,0.3));
      --glass-border: rgba(255,255,255,0.6);
      --glass-highlight: rgba(255,255,255,0.85);
      --glass-shadow: 0 12px 36px rgba(30,30,60,0.16);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg-a);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* --- Ambient liquid background --- */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg-a);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    will-change: transform;
  }
  .blob-1 {
    width: 60vmax; height: 60vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 55vmax; height: 55vmax;
    bottom: -25vmax; right: -18vmax;
    background: radial-gradient(circle at 60% 60%, var(--accent-2), transparent 70%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 45vmax; height: 45vmax;
    bottom: 10vmax; left: 10vmax;
    background: radial-gradient(circle at 50% 50%, var(--green), transparent 70%);
    opacity: 0.3;
    animation: drift3 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, 8vmax) scale(1.08); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-8vmax, -6vmax) scale(1.1); }
  }
  @keyframes drift3 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4vmax, -6vmax) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 108px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* --- Liquid glass base --- */
  .glass {
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight), inset 0 -1px 12px rgba(0,0,0,0.06);
    position: relative;
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.6;
  }

  /* --- Join screen --- */
  #join-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .join-card {
    width: 100%;
    max-width: 380px;
    border-radius: 28px;
    padding: 32px 28px;
  }
  .join-card h1 { text-align: center; font-size: 24px; }
  .join-card .sub { text-align: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 500; }
  input[type=text] {
    width: 100%;
    padding: 13px 16px;
    font-size: 15px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(127,127,127,0.08);
    color: var(--text);
    outline: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  input[type=text]::placeholder { color: var(--muted-2); }
  input[type=text]:focus {
    border-color: var(--accent);
    background: rgba(110,168,255,0.08);
  }
  input[type=text][aria-invalid="true"],
  input[type=text][aria-invalid="true"]:focus {
    border-color: var(--red);
    background: rgba(255,93,93,0.05);
  }
  button {
    cursor: pointer;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
  }
  button:focus-visible,
  input:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    box-shadow: 0 8px 24px rgba(110,168,255,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(110,168,255,0.45), inset 0 1px 0 rgba(255,255,255,0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* --- Dashboard --- */
  #dashboard { display: none; }

  /* --- Floating bar --- */
  .floating-bar {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 688px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 8px 8px 18px;
    border-radius: 999px;
    animation: bar-in 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes bar-in {
    from { opacity: 0; transform: translate(-50%, -14px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  .room-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    min-width: 0;
  }
  .room-badge strong { font-weight: 700; }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted-2);
    box-shadow: 0 0 0 0 rgba(61,220,132,0);
    transition: background 0.3s ease;
    flex-shrink: 0;
  }
  .status-dot.live {
    background: var(--green);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(61,220,132,0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); }
  }
  .btn-leave {
    background: rgba(127,127,127,0.14);
    color: var(--text);
    border: 1px solid var(--glass-border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .btn-leave:hover { background: rgba(127,127,127,0.24); transform: translateY(-1px); }
  .btn-leave:active { transform: translateY(0); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .device {
    border-radius: 20px;
    padding: 18px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .device:hover { transform: translateY(-3px); }
  .device.me { border-color: rgba(110,168,255,0.55); }
  .device .me-tag {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; color: var(--accent); font-weight: 700;
    background: rgba(110,168,255,0.15);
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(110,168,255,0.3);
  }
  .device .name {
    font-size: 15px; font-weight: 600;
    padding-right: 54px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .device .ua {
    font-size: 12px; color: var(--muted);
    margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .level-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 18px;
  }
  .level-pct {
    font-size: 26px;
    font-weight: 700;
    min-width: 100px;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .bar-track {
    flex: 1; height: 10px; border-radius: 6px;
    background: rgba(127,127,127,0.18);
    overflow: hidden;
    border: 1px solid var(--glass-border);
  }
  .bar-fill {
    height: 100%; border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .charging-icon { font-size: 16px; filter: drop-shadow(0 0 6px rgba(255,194,71,0.6)); }
  .battery-time {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: 6px;
  }
  .meta-row {
    display: flex; justify-content: space-between;
    margin-top: 14px; font-size: 12px; color: var(--muted-2);
  }
  .unsupported { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .device.offline { opacity: 0.62; }
  .device.offline:hover { opacity: 0.85; }

  /* --- Presence (real-time connection) --- */
  .presence-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px;
    margin-top: 14px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: rgba(127,127,127,0.12);
    white-space: nowrap;
  }
  .pill .status-dot { width: 7px; height: 7px; }
  .pill.online { color: var(--green); border-color: rgba(61,220,132,0.35); background: rgba(61,220,132,0.12); }
  .pill.offline { color: var(--muted); }
  .presence-sub { font-size: 12px; color: var(--muted); }

  /* --- Extra device info --- */
  .info-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    margin-top: 14px;
    font-size: 12.5px;
  }
  .info-grid dt { color: var(--muted-2); white-space: nowrap; }
  .info-grid dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  details.info { margin-top: 14px; }
  details.info summary {
    cursor: pointer; font-size: 12px; color: var(--muted);
    list-style: none; user-select: none;
  }
  details.info summary::-webkit-details-marker { display: none; }
  details.info summary::before { content: "▸ "; }
  details.info[open] summary::before { content: "▾ "; }
  details.info .info-grid { margin-top: 10px; }
  .empty {
    text-align: center; color: var(--muted);
    padding: 60px 20px; font-size: 14px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="join-screen">
  <div class="join-card glass">
    <h1>🔋 내 배터리 보기</h1>
    <div class="sub">ID를 입력하면 같은 ID를 쓰는 모든 기기의 배터리 상태를 실시간으로 볼 수 있어요.</div>
    <form id="join-form">
      <label for="room-input">내 ID <span style="color: var(--red);">*</span></label>
      <input type="text" id="room-input" placeholder="예: imdhson" autocomplete="off" maxlength="64" autofocus aria-describedby="join-error" aria-required="true">
      <label for="name-input">이 기기 이름 (선택)</label>
      <input type="text" id="name-input" placeholder="예: 내 노트북" autocomplete="off" maxlength="80">
      <button class="btn-primary" id="join-btn" type="submit">입장하기</button>
    </form>
    <div class="error" id="join-error" role="alert" aria-live="assertive"></div>
  </div>
</div>

<div id="dashboard">
  <div class="floating-bar glass" id="floating-bar">
    <div class="room-badge">
      <span class="status-dot" id="status-dot"></span>
      <span>ID: <strong id="room-label"></strong></span>
    </div>
    <button class="btn-leave" id="leave-btn">나가기</button>
  </div>
  <div class="wrap">
    <div class="grid" id="device-grid"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const joinScreen = document.getElementById("join-screen");
  const dashboard = document.getElementById("dashboard");
  const joinForm = document.getElementById("join-form");
  const roomInput = document.getElementById("room-input");
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const joinError = document.getElementById("join-error");
  const roomLabel = document.getElementById("room-label");
  const statusDot = document.getElementById("status-dot");
  const leaveBtn = document.getElementById("leave-btn");
  const grid = document.getElementById("device-grid");

  const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "dev-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function getDeviceId() {
    let id = localStorage.getItem("vmb_deviceId");
    if (!id) {
      id = uuid();
      localStorage.setItem("vmb_deviceId", id);
    }
    return id;
  }

  // High-entropy client hints (Chromium only). Filled in asynchronously.
  let uaHints = null;
  let cachedUA = null;
  let cachedTimezone = null;

  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]).then(function (h) {
      uaHints = h;
      cachedUA = null; // Clear cache to allow re-parsing with high-entropy hints
      sendUpdate();
    }).catch(function () {});
  }

  function parseUA() {
    if (cachedUA) return cachedUA;

    const ua = navigator.userAgent;
    const touch = navigator.maxTouchPoints || 0;
    let m;
    let platform = "기기", os = "", osVersion = "", deviceType = "desktop";
    if (/iPhone/.test(ua)) {
      platform = "iPhone"; os = "iOS"; deviceType = "mobile";
    } else if (/iPad/.test(ua) || (/Macintosh/.test(ua) && touch > 1)) {
      platform = "iPad"; os = "iPadOS"; deviceType = "tablet";
    } else if (/Android/.test(ua)) {
      platform = "Android"; os = "Android";
      deviceType = /Mobile/.test(ua) ? "mobile" : "tablet";
      if ((m = ua.match(/Android (\d+(?:\.\d+)?)/))) osVersion = m[1];
    } else if (/Macintosh/.test(ua)) {
      platform = "Mac"; os = "macOS";
    } else if (/Windows/.test(ua)) {
      platform = "Windows PC"; os = "Windows";
    } else if (/CrOS/.test(ua)) {
      platform = "Chromebook"; os = "ChromeOS";
    } else if (/Linux/.test(ua)) {
      platform = "Linux"; os = "Linux";
    }
    if ((os === "iOS" || os === "iPadOS") && (m = ua.match(/OS (\d+)_(\d+)/))) {
      osVersion = m[1] + "." + m[2];
    }
    if (uaHints && uaHints.platformVersion) {
      const major = parseInt(uaHints.platformVersion, 10);
      if (os === "Windows") osVersion = major >= 13 ? "11" : (major > 0 ? "10" : "");
      else if (os === "macOS" || os === "Android") osVersion = uaHints.platformVersion.replace(/(\.0)+$/, "");
    }
    if (navigator.userAgentData && navigator.userAgentData.mobile) deviceType = "mobile";

    let browser = "";
    if ((m = ua.match(/Edg\/(\d+)/))) browser = "Edge " + m[1];
    else if ((m = ua.match(/SamsungBrowser\/(\d+)/))) browser = "Samsung Internet " + m[1];
    else if ((m = ua.match(/(?:Chrome|CriOS)\/(\d+)/))) browser = "Chrome " + m[1];
    else if ((m = ua.match(/(?:Firefox|FxiOS)\/(\d+)/))) browser = "Firefox " + m[1];
    else if (/Safari\//.test(ua)) browser = "Safari" + ((m = ua.match(/Version\/(\d+(?:\.\d+)?)/)) ? " " + m[1] : "");

    cachedUA = { platform: platform, os: os, osVersion: osVersion, deviceType: deviceType, browser: browser };
    return cachedUA;
  }

  function guessDeviceName() {
    const p = parseUA();
    const browser = p.browser.replace(/ [\d.]+$/, "");
    return browser ? p.platform + " · " + browser : p.platform;
  }

  // Everything else the browser is willing to tell us. Unsupported APIs are skipped.
  function collectInfo() {
    const p = parseUA();
    const info = {
      os: p.os,
      osVersion: p.osVersion,
      browser: p.browser,
      deviceType: p.deviceType,
      visibility: document.visibilityState || ""
    };
    if (uaHints && uaHints.model) info.model = uaHints.model;
    if (window.screen) {
      info.screenW = screen.width || 0;
      info.screenH = screen.height || 0;
    }
    if (window.devicePixelRatio) info.pixelRatio = Math.round(window.devicePixelRatio * 100) / 100;
    if (navigator.hardwareConcurrency) info.cores = navigator.hardwareConcurrency;
    if (navigator.deviceMemory) info.memoryGB = navigator.deviceMemory;
    if (navigator.maxTouchPoints) info.maxTouchPoints = navigator.maxTouchPoints;
    if (navigator.language) info.language = navigator.language;
    try {
      if (!cachedTimezone) {
        cachedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      }
      info.timezone = cachedTimezone;
    } catch (e) {}
    const conn = navigator.connection;
    if (conn) {
      if (conn.effectiveType) info.netType = conn.effectiveType;
      if (conn.downlink) info.downlink = conn.downlink;
      if (conn.rtt) info.rtt = conn.rtt;
      if (conn.saveData) info.saveData = true;
    }
    return info;
  }

  const deviceId = getDeviceId();
  let roomId = localStorage.getItem("vmb_roomId") || "";
  let deviceName = localStorage.getItem("vmb_deviceName") || "";

  let eventSource = null;
  let batteryManager = null;
  let heartbeatTimer = null;
  let lastLevel = null;
  let lastCharging = null;
  let lastChargingTime = null;
  let lastDischargingTime = null;
  let batterySupported = false;

  function sendUpdate() {
    if (!roomId) return;
    let cTime = lastChargingTime === Infinity ? -1 : lastChargingTime;
    let dTime = lastDischargingTime === Infinity ? -1 : lastDischargingTime;
    const body = {
      roomId: roomId,
      deviceId: deviceId,
      name: deviceName || guessDeviceName(),
      supported: batterySupported,
      level: batterySupported ? lastLevel : null,
      charging: batterySupported ? lastCharging : null,
      chargingTime: batterySupported ? cTime : null,
      dischargingTime: batterySupported ? dTime : null,
      userAgent: navigator.userAgent,
      info: collectInfo()
    };
    fetch("/api/battery", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).catch(function () {});
  }

  function onBatteryChange() {
    if (!batteryManager) return;
    lastLevel = batteryManager.level;
    lastCharging = batteryManager.charging;
    lastChargingTime = batteryManager.chargingTime;
    lastDischargingTime = batteryManager.dischargingTime;
    sendUpdate();
  }

  function initBattery() {
    if (navigator.getBattery) {
      navigator.getBattery().then(function (bm) {
        batteryManager = bm;
        batterySupported = true;
        lastLevel = bm.level;
        lastCharging = bm.charging;
        lastChargingTime = bm.chargingTime;
        lastDischargingTime = bm.dischargingTime;
        bm.addEventListener("levelchange", onBatteryChange);
        bm.addEventListener("chargingchange", onBatteryChange);
        bm.addEventListener("chargingtimechange", onBatteryChange);
        bm.addEventListener("dischargingtimechange", onBatteryChange);
        sendUpdate();
      }).catch(function () {
        batterySupported = false;
        sendUpdate();
      });
    } else {
      batterySupported = false;
      sendUpdate();
    }
  }

  function leaveRoom(useBeacon) {
    if (!roomId) return;
    const payload = JSON.stringify({ roomId: roomId, deviceId: deviceId });
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon("/api/leave", new Blob([payload], { type: "application/json" }));
    } else {
      fetch("/api/leave", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      }).catch(function () {});
    }
  }

  // Server clock minus local clock, so relative times don't depend on device clock skew.
  let clockOffset = 0;
  let lastDevices = null;
  const openInfo = new Set();

  // Track battery level history for interpolation
  const levelTracker = {};
  // Cache DOM nodes for the animation loop
  let cachedAnimationRows = [];

  function secondsSince(iso) {
    return Math.max(0, (Date.now() + clockOffset - new Date(iso).getTime()) / 1000);
  }

  function formatDuration(sec) {
    sec = Math.floor(sec);
    if (sec < 60) return sec + "초";
    const min = Math.floor(sec / 60);
    if (min < 60) return min + "분";
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + "시간" + (min % 60 ? " " + (min % 60) + "분" : "");
    return Math.floor(hr / 24) + "일";
  }

  function formatAgo(iso) {
    const diff = secondsSince(iso);
    if (diff < 5) return "방금 전";
    return formatDuration(diff) + " 전";
  }

  const DEVICE_TYPE_LABEL = { desktop: "데스크톱", mobile: "모바일", tablet: "태블릿" };

  function infoRows(d) {
    const i = d.info || {};
    const rows = [];
    function add(label, value) {
      if (value) rows.push([label, value]);
    }
    add("운영체제", [i.os, i.osVersion].filter(Boolean).join(" "));
    add("모델", i.model);
    add("브라우저", i.browser);
    add("기기 유형", DEVICE_TYPE_LABEL[i.deviceType] || i.deviceType);
    if (i.screenW && i.screenH) {
      add("화면", i.screenW + "×" + i.screenH + (i.pixelRatio && i.pixelRatio !== 1 ? " @" + i.pixelRatio + "x" : ""));
    }
    if (i.cores) add("CPU", i.cores + "코어");
    if (i.memoryGB) add("메모리", (i.memoryGB >= 8 ? "8GB 이상" : "약 " + i.memoryGB + "GB"));
    if (i.maxTouchPoints) add("터치", "지원 (" + i.maxTouchPoints + "점)");
    const net = [];
    if (i.netType) net.push(i.netType.toUpperCase());
    if (i.downlink) net.push("~" + i.downlink + "Mbps");
    if (i.rtt) net.push(i.rtt + "ms");
    if (i.saveData) net.push("데이터 절약");
    add("네트워크", net.join(" · "));
    add("언어", i.language);
    add("시간대", i.timezone);
    return rows;
  }

  function renderInfoGrid(rows) {
    return '<dl class="info-grid">' + rows.map(function (r) {
      return '<dt>' + escapeHtml(r[0]) + '</dt><dd>' + escapeHtml(r[1]) + '</dd>';
    }).join("") + '</dl>';
  }

  function renderPresence(d) {
    let pill, sub;
    if (d.online) {
      pill = '<span class="pill online"><span class="status-dot live"></span>실시간 연결됨</span>';
      sub = d.connectedAt ? '접속 <span data-time-connected="' + escapeHtml(d.connectedAt) + '">' + formatDuration(secondsSince(d.connectedAt)) + '</span>째' : "";
    } else {
      pill = '<span class="pill offline"><span class="status-dot"></span>오프라인</span>';
      const timeStr = d.lastSeen || d.updatedAt;
      sub = '마지막 접속 <span data-time-ago="' + escapeHtml(timeStr) + '">' + formatAgo(timeStr) + '</span>';
    }
    let vis = "";
    if (d.online && d.info && d.info.visibility) {
      vis = d.info.visibility === "visible"
        ? '<span class="pill">👀 화면 보는 중</span>'
        : '<span class="pill">💤 백그라운드</span>';
    }
    // We cannot escape HTML of sub anymore since it contains <span>
    return '<div class="presence-row">' + pill + vis +
      (sub ? '<span class="presence-sub">' + sub + '</span>' : '') + '</div>';
  }

  function levelColor(pct) {
    if (pct <= 20) return "var(--red)";
    if (pct <= 50) return "var(--yellow)";
    return "var(--green)";
  }

  function render(devices) {
    lastDevices = devices;
    if (!devices || devices.length === 0) {
      grid.innerHTML = '<div class="empty glass">연결된 기기가 없습니다. 잠시만 기다려주세요…</div>';
      return;
    }

    // Update trackers
    const now = Date.now();
    devices.forEach(function (d) {
      const hasBattery = d.supported && d.level !== null && d.level !== undefined;
      if (hasBattery) {
        const tr = levelTracker[d.id] || {};
        if (tr.level !== d.level || tr.charging !== d.charging) {
          tr.level = d.level;
          tr.charging = d.charging;
          tr.changedAt = now;
        }
        // Force DOM update in animationLoop because the elements were just recreated.
        tr.lastVal = null;
        levelTracker[d.id] = tr;
      }
    });

    grid.innerHTML = devices.map(function (d) {
      const isMe = d.id === deviceId;
      const hasBattery = d.supported && d.level !== null && d.level !== undefined;
      const rows = infoRows(d);
      let levelBlock, infoBlock = "";
      if (hasBattery) {
        // Just render the skeleton for the animation loop to pick up.
        const pct = Math.round(d.level * 100);
        const color = levelColor(pct);
        const chargeIcon = d.charging ? '<span class="charging-icon" title="충전 중" role="img" aria-label="충전 중">⚡</span>' : "";
        let timeText = "";
        if (d.charging) {
          if (d.chargingTime === 0 || d.level === 1) timeText = "충전 완료됨";
          else if (d.chargingTime === -1) timeText = "예상 시간 계산 중...";
          else if (d.chargingTime != null) timeText = "완충까지 약 " + formatDuration(d.chargingTime) + " 남음";
        } else {
          if (d.dischargingTime === -1) timeText = "예상 시간 계산 중...";
          else if (d.dischargingTime != null) timeText = "방전까지 약 " + formatDuration(d.dischargingTime) + " 남음";
        }

        levelBlock =
          '<div class="level-row" data-device-id="' + escapeHtml(d.id) + '">' +
            '<div class="level-pct" style="color:' + color + '"></div>' +
            '<div class="bar-track" aria-hidden="true"><div class="bar-fill" style="background:' + color + '"></div></div>' +
            chargeIcon +
          '</div>';

        if (timeText) {
          levelBlock += '<div class="battery-time">' + escapeHtml(timeText) + '</div>';
        }

        if (rows.length) {
          infoBlock = '<details class="info" data-id="' + escapeHtml(d.id) + '"' + (openInfo.has(d.id) ? ' open' : '') + '>' +
            '<summary>기기 정보</summary>' + renderInfoGrid(rows) + '</details>';
        }
      } else {
        // No battery (desktop PC etc.) or the browser doesn't expose it:
        // show connection status and whatever else we could collect instead.
        levelBlock = '<div class="unsupported">🔌 배터리 정보 없음 — 배터리가 없거나 이 브라우저가 제공하지 않아요</div>';
        if (rows.length) infoBlock = renderInfoGrid(rows);
      }
      const i = d.info || {};
      const summary = [[i.os, i.osVersion].filter(Boolean).join(" "), i.browser].filter(Boolean).join(" · ");
      const safeName = escapeHtml(d.name || "Unknown device");
      const safeUa = escapeHtml(d.userAgent || "");
      return (
        '<div class="device glass' + (isMe ? ' me' : '') + (d.online ? '' : ' offline') + '">' +
          (isMe ? '<span class="me-tag">이 기기</span>' : '') +
          '<div class="name">' + safeName + '</div>' +
          '<div class="ua" title="' + safeUa + '">' + (summary ? escapeHtml(summary) : safeUa) + '</div>' +
          renderPresence(d) +
          levelBlock +
          infoBlock +
          '<div class="meta-row"><span><span data-time-ago="' + escapeHtml(d.updatedAt) + '">' + escapeHtml(formatAgo(d.updatedAt)) + '</span> 업데이트</span></div>' +
        '</div>'
      );
    }).join("");

    // Cache DOM nodes for the animation loop
    cachedAnimationRows = Array.from(document.querySelectorAll(".level-row[data-device-id]")).map(function (row) {
      return {
        id: row.getAttribute("data-device-id"),
        pctEl: row.querySelector(".level-pct"),
        barEl: row.querySelector(".bar-fill")
      };
    });
  }

  // Remember which "기기 정보" panels are expanded across re-renders.
  // Recorded on click (not "toggle", which fires async and can race a re-render).
  grid.addEventListener("click", function (e) {
    const summary = e.target.closest && e.target.closest("details.info > summary");
    if (!summary) return;
    const el = summary.parentElement;
    if (el.open) openInfo.delete(el.dataset.id);
    else openInfo.add(el.dataset.id);
  });

  // Keep relative times ("n초 전", "접속 n분째") fresh between server pushes.
  setInterval(function () {
    if (dashboard.style.display === "none") return;
    const timeAgoEls = document.querySelectorAll("[data-time-ago]");
    for (let i = 0; i < timeAgoEls.length; i++) {
      const el = timeAgoEls[i];
      const newText = formatAgo(el.getAttribute("data-time-ago"));
      if (el.textContent !== newText) {
        el.textContent = newText;
      }
    }
    const timeConnectedEls = document.querySelectorAll("[data-time-connected]");
    for (let i = 0; i < timeConnectedEls.length; i++) {
      const el = timeConnectedEls[i];
      const newText = formatDuration(secondsSince(el.getAttribute("data-time-connected")));
      if (el.textContent !== newText) {
        el.textContent = newText;
      }
    }
  }, 5000);

  function animationLoop() {
    requestAnimationFrame(animationLoop);
    if (dashboard.style.display === "none") return;

    const now = Date.now();
    for (let i = 0; i < cachedAnimationRows.length; i++) {
      const rowData = cachedAnimationRows[i];
      const id = rowData.id;
      const tr = levelTracker[id];
      if (!tr) continue;

      const baseLevel = tr.level;
      let fakeDecimals = 0;

      // If fully charged or completely empty, don't fake decimals.
      if (baseLevel < 1.0 && baseLevel > 0.0) {
        const elapsed = (now - (tr.changedAt || now)) / 1000;

        if (tr.charging) {
          // Asymptotically approach 0.99 added to the base percentage.
          // 1 - exp(-k * t) approaches 1 as t increases.
          // Using a small k means it grows slowly.
          const k = 0.005;
          fakeDecimals = 0.99 * (1 - Math.exp(-k * elapsed));
        } else {
          // Discharging: simulate a drop. Since we only know the current level,
          // we can assume it starts at level + 0.99 and slowly drops to level + 0.00.
          // However, to make it realistic from when we loaded, we just guess it's slowly dropping.
          // Since level is e.g. 0.85, the true percentage is somewhere between 85.00 and 85.99.
          // If we want it to decrease, we can start at 0.99 and drop.
          // Let's have it slowly drain.
          const k = 0.001;
          fakeDecimals = 0.99 * Math.exp(-k * elapsed);
        }
      }

      // If battery is 100% (1.0) and charging, or 0% (0.0), fakeDecimals is 0.
      let val = Math.round(baseLevel * 100) + fakeDecimals;
      // Clamp just in case.
      if (val >= 100) val = 100;
      if (val < 0) val = 0;

      const valStr = val.toFixed(2) + "%";

      // Avoid DOM writes if the value hasn't changed
      if (tr.lastVal !== valStr) {
        tr.lastVal = valStr;
        if (rowData.pctEl && rowData.barEl) {
          rowData.pctEl.textContent = valStr;
          rowData.barEl.style.width = valStr;
        }
      }
    }
  }
  requestAnimationFrame(animationLoop);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function connectStream() {
    if (eventSource) eventSource.close();
    // Passing deviceId makes this open stream our real-time presence signal.
    eventSource = new EventSource("/api/stream?roomId=" + encodeURIComponent(roomId) +
      "&deviceId=" + encodeURIComponent(deviceId));
    eventSource.onopen = function () {
      statusDot.classList.add("live");
    };
    eventSource.onerror = function () {
      statusDot.classList.remove("live");
    };
    eventSource.onmessage = function (evt) {
      try {
        const snap = JSON.parse(evt.data);
        if (snap.serverTime) clockOffset = new Date(snap.serverTime).getTime() - Date.now();
        render(snap.devices);
      } catch (e) {
        console.error("Error parsing server message:", e);
      }
    };
  }

  function showDashboard() {
    joinScreen.style.display = "none";
    dashboard.style.display = "block";
    roomLabel.textContent = roomId;
    document.title = roomId + " - 내 배터리 보기";

    connectStream();
    initBattery();

    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function () {
      if (batterySupported && batteryManager) {
        lastLevel = batteryManager.level;
        lastCharging = batteryManager.charging;
        lastChargingTime = batteryManager.chargingTime;
        lastDischargingTime = batteryManager.dischargingTime;
      }
      sendUpdate();
    }, 10000);
  }

  // Closing the tab no longer removes the device: its stream drops, so other
  // devices see it go offline (with "last seen") instead. "나가기" still removes it.
  document.addEventListener("visibilitychange", sendUpdate);
  window.addEventListener("online", sendUpdate);
  if (navigator.connection && navigator.connection.addEventListener) {
    navigator.connection.addEventListener("change", sendUpdate);
  }

  function tryJoin(id, name) {
    id = (id || "").trim();
    if (!ID_RE.test(id)) {
      roomInput.setAttribute("aria-invalid", "true");
      joinError.textContent = "ID는 영문/숫자/-/_ 조합, 1~64자로 입력해주세요.";
      roomInput.focus();
      return;
    }
    roomInput.removeAttribute("aria-invalid");
    joinError.textContent = "";
    roomId = id;
    deviceName = (name || "").trim();
    localStorage.setItem("vmb_roomId", roomId);
    localStorage.setItem("vmb_deviceName", deviceName);
    showDashboard();
  }

  roomInput.addEventListener("input", function () {
    roomInput.removeAttribute("aria-invalid");
    joinError.textContent = "";
  });

  joinForm.addEventListener("submit", function (e) {
    e.preventDefault();
    tryJoin(roomInput.value, nameInput.value);
  });

  leaveBtn.addEventListener("click", function () {
    leaveRoom(false);
    if (eventSource) eventSource.close();
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    localStorage.removeItem("vmb_roomId");
    roomId = "";
    document.title = "내 배터리 보기";
    dashboard.style.display = "none";
    joinScreen.style.display = "flex";
    roomInput.value = "";
    roomInput.focus();
  });

  // Auto-rejoin if we already have a saved room id.
  if (roomId) {
    showDashboard();
  } else {
    joinScreen.style.display = "flex";
  }
  if (deviceName) nameInput.value = deviceName;
})();
</script>
</body>
</html>
