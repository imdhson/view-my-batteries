<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>내 배터리 보기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg-a: #0b0e14;
    --bg-b: #171226;
    --bg-c: #0d1b1f;
    --text: #eef0f4;
    --muted: rgba(238, 240, 244, 0.6);
    --muted-2: rgba(238, 240, 244, 0.4);
    --accent: #6ea8ff;
    --accent-2: #8f6bff;
    --green: #3ddc84;
    --yellow: #ffc247;
    --red: #ff5d5d;

    --glass-fill: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    --glass-fill-strong: linear-gradient(160deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    --glass-border: rgba(255,255,255,0.22);
    --glass-highlight: rgba(255,255,255,0.35);
    --glass-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-a: #eef2ff;
      --bg-b: #fdeef7;
      --bg-c: #e9fbf3;
      --text: #1b1e27;
      --muted: rgba(27, 30, 39, 0.62);
      --muted-2: rgba(27, 30, 39, 0.42);
      --glass-fill: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.22));
      --glass-fill-strong: linear-gradient(160deg, rgba(255,255,255,0.7), rgba(255,255,255,0.3));
      --glass-border: rgba(255,255,255,0.6);
      --glass-highlight: rgba(255,255,255,0.85);
      --glass-shadow: 0 12px 36px rgba(30,30,60,0.16);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg-a);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* --- Ambient liquid background --- */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg-a);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
    will-change: transform;
  }
  .blob-1 {
    width: 60vmax; height: 60vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle at 30% 30%, var(--accent), transparent 70%);
    animation: drift1 26s ease-in-out infinite alternate;
  }
  .blob-2 {
    width: 55vmax; height: 55vmax;
    bottom: -25vmax; right: -18vmax;
    background: radial-gradient(circle at 60% 60%, var(--accent-2), transparent 70%);
    animation: drift2 32s ease-in-out infinite alternate;
  }
  .blob-3 {
    width: 45vmax; height: 45vmax;
    bottom: 10vmax; left: 10vmax;
    background: radial-gradient(circle at 50% 50%, var(--green), transparent 70%);
    opacity: 0.3;
    animation: drift3 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, 8vmax) scale(1.08); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-8vmax, -6vmax) scale(1.1); }
  }
  @keyframes drift3 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(4vmax, -6vmax) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none; }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 108px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  /* --- Liquid glass base --- */
  .glass {
    background: var(--glass-fill);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight), inset 0 -1px 12px rgba(0,0,0,0.06);
    position: relative;
  }
  .glass::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0) 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.6;
  }

  /* --- Join screen --- */
  #join-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .join-card {
    width: 100%;
    max-width: 380px;
    border-radius: 28px;
    padding: 32px 28px;
  }
  .join-card h1 { text-align: center; font-size: 24px; }
  .join-card .sub { text-align: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 500; }
  input[type=text] {
    width: 100%;
    padding: 13px 16px;
    font-size: 15px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    background: rgba(127,127,127,0.08);
    color: var(--text);
    outline: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  input[type=text]::placeholder { color: var(--muted-2); }
  input[type=text]:focus {
    border-color: var(--accent);
    background: rgba(110,168,255,0.08);
  }
  button {
    cursor: pointer;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    box-shadow: 0 8px 24px rgba(110,168,255,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(110,168,255,0.45), inset 0 1px 0 rgba(255,255,255,0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* --- Dashboard --- */
  #dashboard { display: none; }

  /* --- Floating bar --- */
  .floating-bar {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 688px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 8px 8px 18px;
    border-radius: 999px;
    animation: bar-in 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes bar-in {
    from { opacity: 0; transform: translate(-50%, -14px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  .room-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    min-width: 0;
  }
  .room-badge strong { font-weight: 700; }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted-2);
    box-shadow: 0 0 0 0 rgba(61,220,132,0);
    transition: background 0.3s ease;
    flex-shrink: 0;
  }
  .status-dot.live {
    background: var(--green);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(61,220,132,0.5); }
    70%  { box-shadow: 0 0 0 7px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); }
  }
  .btn-leave {
    background: rgba(127,127,127,0.14);
    color: var(--text);
    border: 1px solid var(--glass-border);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .btn-leave:hover { background: rgba(127,127,127,0.24); transform: translateY(-1px); }
  .btn-leave:active { transform: translateY(0); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .device {
    border-radius: 20px;
    padding: 18px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .device:hover { transform: translateY(-3px); }
  .device.me { border-color: rgba(110,168,255,0.55); }
  .device .me-tag {
    position: absolute; top: 16px; right: 16px;
    font-size: 11px; color: var(--accent); font-weight: 700;
    background: rgba(110,168,255,0.15);
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid rgba(110,168,255,0.3);
  }
  .device .name {
    font-size: 15px; font-weight: 600;
    padding-right: 54px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .device .ua {
    font-size: 12px; color: var(--muted);
    margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .level-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 18px;
  }
  .level-pct { font-size: 26px; font-weight: 700; min-width: 62px; letter-spacing: -0.5px; }
  .bar-track {
    flex: 1; height: 10px; border-radius: 6px;
    background: rgba(127,127,127,0.18);
    overflow: hidden;
    border: 1px solid var(--glass-border);
  }
  .bar-fill {
    height: 100%; border-radius: 6px;
    transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .charging-icon { font-size: 16px; filter: drop-shadow(0 0 6px rgba(255,194,71,0.6)); }
  .meta-row {
    display: flex; justify-content: space-between;
    margin-top: 14px; font-size: 12px; color: var(--muted-2);
  }
  .unsupported { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .empty {
    text-align: center; color: var(--muted);
    padding: 60px 20px; font-size: 14px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div id="join-screen">
  <div class="join-card glass">
    <h1>🔋 내 배터리 보기</h1>
    <div class="sub">ID를 입력하면 같은 ID를 쓰는 모든 기기의 배터리 상태를 실시간으로 볼 수 있어요.</div>
    <label for="room-input">내 ID</label>
    <input type="text" id="room-input" placeholder="예: imdhson" autocomplete="off" maxlength="64">
    <label for="name-input">이 기기 이름 (선택)</label>
    <input type="text" id="name-input" placeholder="예: 내 노트북" autocomplete="off" maxlength="80">
    <button class="btn-primary" id="join-btn">입장하기</button>
    <div class="error" id="join-error"></div>
  </div>
</div>

<div id="dashboard">
  <div class="floating-bar glass" id="floating-bar">
    <div class="room-badge">
      <span class="status-dot" id="status-dot"></span>
      <span>ID: <strong id="room-label"></strong></span>
    </div>
    <button class="btn-leave" id="leave-btn">나가기</button>
  </div>
  <div class="wrap">
    <div class="grid" id="device-grid"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const joinScreen = document.getElementById("join-screen");
  const dashboard = document.getElementById("dashboard");
  const roomInput = document.getElementById("room-input");
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const joinError = document.getElementById("join-error");
  const roomLabel = document.getElementById("room-label");
  const statusDot = document.getElementById("status-dot");
  const leaveBtn = document.getElementById("leave-btn");
  const grid = document.getElementById("device-grid");

  const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "dev-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  function getDeviceId() {
    let id = localStorage.getItem("vmb_deviceId");
    if (!id) {
      id = uuid();
      localStorage.setItem("vmb_deviceId", id);
    }
    return id;
  }

  function guessDeviceName() {
    const ua = navigator.userAgent;
    let platform = "기기";
    if (/iPhone/.test(ua)) platform = "iPhone";
    else if (/iPad/.test(ua)) platform = "iPad";
    else if (/Android/.test(ua)) platform = "Android";
    else if (/Macintosh/.test(ua)) platform = "Mac";
    else if (/Windows/.test(ua)) platform = "Windows PC";
    else if (/Linux/.test(ua)) platform = "Linux";
    let browser = "";
    if (/Edg\//.test(ua)) browser = "Edge";
    else if (/Chrome\//.test(ua)) browser = "Chrome";
    else if (/Firefox\//.test(ua)) browser = "Firefox";
    else if (/Safari\//.test(ua)) browser = "Safari";
    return browser ? platform + " · " + browser : platform;
  }

  const deviceId = getDeviceId();
  let roomId = localStorage.getItem("vmb_roomId") || "";
  let deviceName = localStorage.getItem("vmb_deviceName") || "";

  let eventSource = null;
  let batteryManager = null;
  let heartbeatTimer = null;
  let lastLevel = null;
  let lastCharging = null;
  let batterySupported = false;

  function sendUpdate() {
    if (!roomId) return;
    const body = {
      roomId: roomId,
      deviceId: deviceId,
      name: deviceName || guessDeviceName(),
      supported: batterySupported,
      level: batterySupported ? lastLevel : null,
      charging: batterySupported ? lastCharging : null,
      userAgent: navigator.userAgent
    };
    fetch("/api/battery", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).catch(function () {});
  }

  function onBatteryChange() {
    if (!batteryManager) return;
    lastLevel = batteryManager.level;
    lastCharging = batteryManager.charging;
    sendUpdate();
  }

  function initBattery() {
    if (navigator.getBattery) {
      navigator.getBattery().then(function (bm) {
        batteryManager = bm;
        batterySupported = true;
        lastLevel = bm.level;
        lastCharging = bm.charging;
        bm.addEventListener("levelchange", onBatteryChange);
        bm.addEventListener("chargingchange", onBatteryChange);
        sendUpdate();
      }).catch(function () {
        batterySupported = false;
        sendUpdate();
      });
    } else {
      batterySupported = false;
      sendUpdate();
    }
  }

  function leaveRoom(useBeacon) {
    if (!roomId) return;
    const payload = JSON.stringify({ roomId: roomId, deviceId: deviceId });
    if (useBeacon && navigator.sendBeacon) {
      navigator.sendBeacon("/api/leave", new Blob([payload], { type: "application/json" }));
    } else {
      fetch("/api/leave", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true
      }).catch(function () {});
    }
  }

  function formatAgo(iso) {
    const diff = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 5) return "방금 전";
    if (diff < 60) return Math.floor(diff) + "초 전";
    return Math.floor(diff / 60) + "분 전";
  }

  function levelColor(pct) {
    if (pct <= 20) return "var(--red)";
    if (pct <= 50) return "var(--yellow)";
    return "var(--green)";
  }

  function render(devices) {
    if (!devices || devices.length === 0) {
      grid.innerHTML = '<div class="empty glass">연결된 기기가 없습니다. 잠시만 기다려주세요…</div>';
      return;
    }
    grid.innerHTML = devices.map(function (d) {
      const isMe = d.id === deviceId;
      let levelBlock;
      if (d.supported && d.level !== null && d.level !== undefined) {
        const pct = Math.round(d.level * 100);
        const color = levelColor(pct);
        const chargeIcon = d.charging ? '<span class="charging-icon" title="충전 중">⚡</span>' : "";
        levelBlock =
          '<div class="level-row">' +
            '<div class="level-pct" style="color:' + color + '">' + pct + '%</div>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
            chargeIcon +
          '</div>';
      } else {
        levelBlock = '<div class="unsupported">이 브라우저는 배터리 정보를 지원하지 않습니다</div>';
      }
      const safeName = escapeHtml(d.name || "Unknown device");
      const safeUa = escapeHtml(d.userAgent || "");
      return (
        '<div class="device glass' + (isMe ? ' me' : '') + '">' +
          (isMe ? '<span class="me-tag">이 기기</span>' : '') +
          '<div class="name">' + safeName + '</div>' +
          '<div class="ua">' + safeUa + '</div>' +
          levelBlock +
          '<div class="meta-row"><span>' + formatAgo(d.updatedAt) + ' 업데이트</span></div>' +
        '</div>'
      );
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function connectStream() {
    if (eventSource) eventSource.close();
    eventSource = new EventSource("/api/stream?roomId=" + encodeURIComponent(roomId));
    eventSource.onopen = function () {
      statusDot.classList.add("live");
    };
    eventSource.onerror = function () {
      statusDot.classList.remove("live");
    };
    eventSource.onmessage = function (evt) {
      try {
        render(JSON.parse(evt.data));
      } catch (e) {}
    };
  }

  function showDashboard() {
    joinScreen.style.display = "none";
    dashboard.style.display = "block";
    roomLabel.textContent = roomId;

    connectStream();
    initBattery();

    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function () {
      if (batterySupported && batteryManager) {
        lastLevel = batteryManager.level;
        lastCharging = batteryManager.charging;
      }
      sendUpdate();
    }, 10000);

    window.addEventListener("beforeunload", function () {
      leaveRoom(true);
    });
  }

  function tryJoin(id, name) {
    id = (id || "").trim();
    if (!ID_RE.test(id)) {
      joinError.textContent = "ID는 영문/숫자/-/_ 조합, 1~64자로 입력해주세요.";
      return;
    }
    joinError.textContent = "";
    roomId = id;
    deviceName = (name || "").trim();
    localStorage.setItem("vmb_roomId", roomId);
    localStorage.setItem("vmb_deviceName", deviceName);
    showDashboard();
  }

  joinBtn.addEventListener("click", function () {
    tryJoin(roomInput.value, nameInput.value);
  });
  roomInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryJoin(roomInput.value, nameInput.value);
  });
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryJoin(roomInput.value, nameInput.value);
  });

  leaveBtn.addEventListener("click", function () {
    leaveRoom(false);
    if (eventSource) eventSource.close();
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    localStorage.removeItem("vmb_roomId");
    roomId = "";
    dashboard.style.display = "none";
    joinScreen.style.display = "flex";
    roomInput.value = "";
    roomInput.focus();
  });

  // Auto-rejoin if we already have a saved room id.
  if (roomId) {
    showDashboard();
  } else {
    joinScreen.style.display = "flex";
  }
  if (deviceName) nameInput.value = deviceName;
})();
</script>
</body>
</html>
